<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Plants</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg">
    <ul th:replace="~{fragments/nav :: nav}"></ul>

    <div class="content-wide">
        <h1>Browse All Plants</h1>
        <div class="plant-grid">
            <a class="plant-card" th:each="plant : ${plants}"
               th:href="@{/search(search=${plant.commonName})}">
                <img th:src="${plant.imgPath}" th:alt="${plant.commonName}">
                <div class="plant-card-info">
                    <h3 th:text="${plant.commonName}">Plant Name</h3>
                    <p th:text="${plant.sciName}">Scientific Name</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
