<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <ul th:replace="~{fragments/nav :: nav}"></ul>

    <div id="center">
        <h1>Search for your plant!</h1>
        <form action="/search" method="post">
            <input type="text" name="search" placeholder="e.g. succulent">
            <input type="submit" value="Search">
        </form>
    </div>
</body>
</html>
